<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Erreurs — Bil</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0e0e0f;--surface:#17171a;--surface2:#1e1e23;
  --border:#2a2a32;--accent:#c8a96e;
  --text:#e8e6e0;--muted:#6b6872;
  --warning-text:#e8b48a;--done-text:#89c49a;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;padding:40px 20px;}

.container{max-width:900px;margin:auto;}

/* HEADER */
header{margin-bottom:30px;}
h1{font-family:'Playfair Display';}

/* TOOLBAR */
.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0 25px;
}

.toolbar button{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 10px;
  cursor:pointer;
  font-size:11px;
  font-family:'DM Mono', monospace;
}

.toolbar button:hover{
  border-color:var(--accent);
  color:var(--accent);
}

/* CAT */
.cat{
  background:var(--surface);
  border:1px solid var(--border);
  margin-bottom:10px;
  border-radius:6px;
  overflow:hidden;
}
.cat-header{
  padding:10px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}
.cat-body{display:none;padding:10px;border-top:1px solid var(--border);}
.cat-body.open{display:block;}

.subcat{
  padding:5px 10px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Suivi des erreurs</h1>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <button onclick="addCat()">+ Catégorie</button>
  <button onclick="editCat()">Modifier Catégorie</button>
  <button onclick="deleteCat()">Supprimer Catégorie</button>
  <button onclick="addSubcat()">+ Sous-catégorie</button>
  <button onclick="editSubcat()">Modifier Sous-cat</button>
  <button onclick="deleteSubcat()">Supprimer Sous-cat</button>
</div>

<div id="cats"></div>

</div>

<script>

let currentCats = [
  {
    nom:"Orthographe",
    sous_categories:[
      "a / à",
      "et / est",
      "son / sont"
    ]
  }
];

let selectedCat = null;

/* RENDER */
function render(){
  const c = document.getElementById("cats");
  c.innerHTML="";

  currentCats.forEach(cat=>{
    const div=document.createElement("div");
    div.className="cat";

    div.innerHTML=`
      <div class="cat-header" onclick="selectCat('${cat.nom}')">
        <strong>${cat.nom}</strong>
        <span>${cat.sous_categories.length}</span>
      </div>
      <div class="cat-body ${selectedCat===cat.nom?'open':''}">
        ${cat.sous_categories.map(s=>`<div class="subcat">${s}</div>`).join("")}
      </div>
    `;

    c.appendChild(div);
  });
}

function selectCat(name){
  selectedCat = name;
  render();
}

/* CAT */
function addCat(){
  const name = prompt("Nom de la catégorie ?");
  if(!name) return;
  currentCats.push({nom:name,sous_categories:[]});
  render();
}

function editCat(){
  const old = prompt("Nom catégorie ?");
  const cat = currentCats.find(c=>c.nom===old);
  if(!cat) return alert("introuvable");
  const neu = prompt("Nouveau nom ?",cat.nom);
  if(!neu) return;
  cat.nom = neu;
  render();
}

function deleteCat(){
  const name = prompt("Nom catégorie ?");
  currentCats = currentCats.filter(c=>c.nom!==name);
  render();
}

/* SUBCAT */
function addSubcat(){
  if(!selectedCat) return alert("choisis une catégorie");
  const cat = currentCats.find(c=>c.nom===selectedCat);
  const name = prompt("Sous-catégorie ?");
  if(!name) return;
  cat.sous_categories.push(name);
  render();
}

function editSubcat(){
  if(!selectedCat) return;
  const cat = currentCats.find(c=>c.nom===selectedCat);
  const old = prompt("Sous-cat ?");
  const i = cat.sous_categories.indexOf(old);
  if(i===-1) return;
  const neu = prompt("nouveau nom ?",old);
  if(!neu) return;
  cat.sous_categories[i]=neu;
  render();
}

function deleteSubcat(){
  if(!selectedCat) return;
  const cat = currentCats.find(c=>c.nom===selectedCat);
  const name = prompt("Sous-cat ?");
  cat.sous_categories = cat.sous_categories.filter(s=>s!==name);
  render();
}

render();

</script>

</body>
</html>
