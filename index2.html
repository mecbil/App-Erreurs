<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des Erreurs — Bil</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="noise"></div>
<div class="container">

  <header>
    <div class="eyebrow">CRPE 2026 — Bil</div>
    <h1>Suivi des <span>Erreurs</span></h1>
    <div class="subtitle" id="headerSubtitle">Chargement des matières...</div>
  </header>

  <!-- PAGE ACCUEIL -->
  <div id="page-accueil">
    <div class="accueil-label">Choisir une matière</div>
    <div class="matieres-grid" id="matieresGrid">
      <div style="color:var(--muted); text-align:center; padding:40px;">Chargement...</div>
    </div>
  </div>

  <!-- PAGE ERREURS -->
  <div id="page-erreurs">
    <button class="back-btn" id="backBtn">← Toutes les matières</button>

    <div class="error-message" id="errorMessage"></div>

    <div class="stats">
      <div class="stat"><div class="stat-label">Total</div><div class="stat-value total" id="statTotal">0</div></div>
      <div class="stat"><div class="stat-label">À revoir</div><div class="stat-value review" id="statReview">0</div></div>
      <div class="stat"><div class="stat-label">Maîtrisées</div><div class="stat-value mastered" id="statMastered">0</div></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Toutes</button>
      <button class="filter-btn" data-filter="À revoir">À revoir</button>
      <button class="filter-btn" data-filter="En cours">En cours</button>
      <button class="filter-btn" data-filter="Maîtrisé">Maîtrisées</button>
    </div>

    <div id="categoriesContainer"></div>

    <div class="form-section">
      <div class="form-header">Ajouter une erreur</div>
      <div class="form-body">
        <div class="form-grid">
          <div class="form-field">
            <label class="form-label">Catégorie</label>
            <select id="fCat"></select>
          </div>
          <div class="form-field">
            <label class="form-label">Sous-catégorie</label>
            <select id="fSub"></select>
          </div>
          <div class="form-field">
            <label class="form-label">Erreur</label>
            <input id="fErr" placeholder="ex: hesitation" />
          </div>
          <div class="form-field">
            <label class="form-label">Correction</label>
            <input id="fCor" placeholder="ex: hésitation" />
          </div>
          <div class="form-field">
            <label class="form-label">Statut</label>
            <select id="fStatus">
              <option>À revoir</option>
              <option>En cours</option>
              <option>Maîtrisé</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label">Révision dans</label>
            <select id="fRevision">
              <option value="0">Aujourd'hui</option>
              <option value="1" selected>1 jour</option>
              <option value="3">3 jours</option>
              <option value="7">1 semaine</option>
              <option value="14">2 semaines</option>
            </select>
          </div>
        </div>
        <button class="add-btn" id="addBtn">Ajouter l'erreur</button>
        <button class="add-btn inactive" style="margin-top:8px" disabled>+ Nouvelle sous-catégorie (bientôt)</button>
      </div>
    </div>

    <button class="reset-btn" id="resetBtn">Réinitialiser les erreurs de cette matière</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
